<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-clone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111a33"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#4d6bff"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- reference frame: dashed, the screenshot you show -->
  <rect x="9.5" y="15.5" width="24" height="18" rx="4.5" fill="none" stroke="#7aa2ff" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="3.5 3"/>

  <!-- rebuilt frame: solid, what the agents ship -->
  <rect x="27" y="27" width="27" height="21" rx="5" fill="#0a1020" stroke="url(#frame)" stroke-width="2.6"/>

  <!-- the rebuilt UI inside the shipped frame -->
  <rect x="32" y="32" width="11" height="2.6" rx="1.3" fill="url(#frame)"/>
  <rect x="32" y="37.5" width="17" height="2.2" rx="1.1" fill="#7aa2ff" fill-opacity="0.55"/>
  <rect x="32" y="42" width="13" height="2.2" rx="1.1" fill="#7aa2ff" fill-opacity="0.35"/>

  <!-- copy arrow from reference to rebuild -->
  <path d="M23 42c2.4 2.2 4.4 3.2 6.6 3.2" fill="none" stroke="#7aa2ff" stroke-opacity="0.6" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M27.4 43.2l2.6 2.1-3.2 1.2z" fill="#7aa2ff" fill-opacity="0.6"/>
</svg>
