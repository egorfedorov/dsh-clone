<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Pro — Billing</title>
<style>
/*
LAYOUT SPEC — measured from card-reference.png (520x360, 1x)
================================================================
REGIONS (top to bottom, all inside one card)
  1. Page backdrop: flat deep navy, card inset 24px on every side.
  2. Card: 472 x 312 incl. 2px border, r20, surface #182234.
  3. Identity header (65px tall): 65px circular monogram + plan name
     (20px) over billing cycle (12px), 19px gap.
  4. Usage rule: full content width, 5px tall, r3, #243350;
     27px below the avatar, 9px above the fact list.
  5. Facts: 3 rows, 38px pitch, label left / value right, 13px.
  6. Actions: two 41px buttons, 11px gutter, label aligned left with
     26px inset; primary 189px wide, secondary fills the remainder.
CARD PADDING  30 top / 26 sides / 5 bottom (content box 416 x 308).
GRID          single centred card; content column = 416px; facts and
              actions use space-between / 189px + 1fr.
SPACING SCALE 5 · 9 · 11 · 19 · 24 · 26 · 27 · 30 · 38 · 41 · 65.
PALETTE
  page            #101826
  card surface    #182234
  card border     #2a3a52
  rule / track    #243350
  accent blue     #5b7cff
  primary text    #f3f7ff
  muted text      #8b98b0
  mono letter     #0a0e16
TYPE SCALE (system sans stack)
  plan name       20px / 24px / 500 / #f3f7ff
  billing cycle   12px / 16px / 400 / #8b98b0
  fact label      13px / 400 / #8b98b0
  fact value      13px / 400 / #f3f7ff
  button labels   13px, primary 500 #fff / secondary 400 #8b98b0
  monogram        31px / 400 / #0a0e16, optically offset inside circle
RADII  card 20px · buttons 10px · rule 3px · avatar 50%.
*/
:root{
  --page:#101826;
  --surface:#182234;
  --line:#2a3a52;
  --track:#243350;
  --accent:#5b7cff;
  --ink:#f3f7ff;
  --muted:#8b98b0;
  --mono-ink:#0a0e16;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  padding:24px;
  display:grid;
  place-items:center;
  background:var(--page);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.card{
  width:472px;
  max-width:100%;
  min-height:312px;
  padding:30px 26px 5px;
  display:flex;
  flex-direction:column;
  background:var(--surface);
  border:2px solid var(--line);
  border-radius:20px;
}
.identity{
  display:flex;
  align-items:flex-start;
  gap:19px;
  height:65px;
}
.avatar{
  flex:0 0 65px;
  width:65px;
  height:65px;
  border-radius:50%;
  background:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  user-select:none;
}
.avatar span{
  display:block;
  font-size:31px;
  font-weight:400;
  line-height:1;
  color:var(--mono-ink);
  transform:translate(9px,7px);
}
.identity-copy{margin-top:8px;min-width:0}
.plan-name{
  margin:0;
  font-size:20px;
  line-height:24px;
  font-weight:500;
  letter-spacing:.3px;
  color:var(--ink);
}
.plan-cycle{
  margin:5px 0 0 1px;
  font-size:12px;
  line-height:16px;
  font-weight:400;
  letter-spacing:-.2px;
  color:var(--muted);
  white-space:nowrap;
}
.plan-cycle .sep{padding:0 1px}
.usage-rule{
  margin-top:27px;
  height:5px;
  border-radius:3px;
  background:var(--track);
}
.facts{
  margin:9px 1px 0 -1px;
  padding:0;
  list-style:none;
}
.fact{
  height:38px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  font-size:13px;
  line-height:16px;
}
.fact dt{
  margin:0;
  font-weight:400;
  color:var(--muted);
  white-space:nowrap;
}
.fact dd{
  margin:0;
  font-weight:400;
  color:var(--ink);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.actions{
  margin-top:12px;
  display:grid;
  grid-template-columns:189px minmax(0,1fr);
  gap:11px;
}
.btn{
  appearance:none;
  height:41px;
  margin:0;
  padding:0 0 0 26px;
  border:0;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  font-family:inherit;
  font-size:13px;
  line-height:1;
  font-weight:500;
  letter-spacing:.3px;
  text-align:left;
  cursor:pointer;
  transition:background-color .15s ease,border-color .15s ease,color .15s ease;
}
.btn-primary{
  background:var(--accent);
  color:#fff;
}
.btn-primary:hover{background:#6a88ff}
.btn-primary:active{background:#506fe6}
.btn-secondary{
  padding-left:31px;
  background:transparent;
  border:2px solid var(--line);
  color:var(--muted);
  font-weight:400;
  font-size:13px;
  letter-spacing:-.4px;
}
.btn-secondary:hover{border-color:#3a4d6b;color:#aab6c9}
.btn-secondary:active{border-color:#445a7c}
.btn:focus-visible{
  outline:2px solid var(--ink);
  outline-offset:2px;
}
@media (max-width:460px){
  body{padding:16px}
  .card{width:100%;padding:24px 20px 20px;min-height:0}
  .actions{grid-template-columns:1fr;padding-bottom:3px}
  .actions .btn{padding-left:20px}
  .identity{gap:16px}
  .plan-cycle{white-space:normal}
  .usage-rule{margin-top:22px}
}
@media (prefers-reduced-motion:reduce){
  .btn{transition:none}
}
</style>
</head>
<body>
<main class="card" aria-labelledby="plan-name">
  <header class="identity">
    <div class="avatar" aria-hidden="true"><span>A</span></div>
    <div class="identity-copy">
      <h1 class="plan-name" id="plan-name">Aurora Pro</h1>
      <p class="plan-cycle">annual plan<span class="sep"> · </span>renews May 12</p>
    </div>
  </header>

  <div class="usage-rule" role="img" aria-label="Storage usage bar"></div>

  <dl class="facts">
    <div class="fact"><dt>Storage</dt><dd>412 GB of 500 GB</dd></div>
    <div class="fact"><dt>Seats</dt><dd>7 of 10 used</dd></div>
    <div class="fact"><dt>Next invoice</dt><dd>$1,188.00</dd></div>
  </dl>

  <div class="actions">
    <button type="button" class="btn btn-primary">Manage plan</button>
    <button type="button" class="btn btn-secondary">Download invoices</button>
  </div>
</main>
</body>
</html>
